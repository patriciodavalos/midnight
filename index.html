<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador 3D México - GitHub Pages OK</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#0a0a0a;color:#ddd;height:100vh;overflow:hidden;position:relative}
        #viewer-container{flex:1;background:#111;position:relative;overflow:hidden}
        #viewer-container canvas{position:absolute;top:0;left:0;width:100%;height:100%}
        #controls-bar,#add-current-btn,#cart-toggle{position:relative;z-index:1000}
        #initial-screen{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:1000}
        #initial-upload-btn{background:#f28c38;color:white;padding:20px 45px;border:none;border-radius:12px;font-size:20px;font-weight:bold;cursor:pointer;box-shadow:0 10px 30px rgba(242,140,56,.5);transition:all .3s}
        #initial-upload-btn:hover{background:#e67e22;transform:scale(1.05)}
        #main-app{display:none;height:100vh;flex-direction:column}
        #main-app.active{display:flex}
        #top-panel{display:flex;flex:1;position:relative}
        #left-panel{width:300px;background:#111;padding:14px;font-size:12.5px;overflow-y:auto;border-right:2px solid #f28c38}
        .header-left{padding:10px;background:#f28c38;color:white;text-align:center;font-weight:bold;font-size:16px;border-radius:8px 8px 0 0;margin:-14px -14px 16px -14px}
        label{margin:10px 0 4px;color:#f28c38;font-weight:bold;font-size:13px;display:block}
        select,input[type=number]{width:100%;padding:7px;border-radius:6px;border:none;background:#222;color:white;font-size:12.5px;margin-bottom:8px}
        .material-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
        .material-btn,.post-btn{padding:9px;background:#333;border:none;border-radius:6px;color:white;cursor:pointer;font-size:11.8px;transition:all .2s}
        .material-btn:hover,.post-btn:hover,.material-btn.selected,.post-btn.selected{background:#f28c38;font-weight:bold}
        .post-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px 0}
        .price-box{background:#222;padding:12px;border-radius:8px;border:2px solid #f28c38;margin-top:16px;font-size:13px}
        .price-line{display:flex;justify-content:space-between;margin:6px 0}
        .price-total{font-size:17px!important;color:#f28c38!important;font-weight:bold;border-top:1px solid #444;padding-top:8px}
        #controls-bar{position:absolute;top:14px;left:14px;z-index:100;display:flex;gap:10px}
        #controls-bar button{padding:10px 20px;background:#f28c38;color:white;border:none;border-radius:8px;font-size:13px;cursor:pointer}
        #analysis-btn{background:#007bff}
        #xray-btn{background:#ff6b35}
        #analysis-btn.active,#xray-btn.active{background:#28a745}
        #loading-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);padding:18px 40px;border-radius:12px;font-size:15px;border:2px solid #f28c38;color:#f28c38;display:none;z-index:1000}
        #loading-msg.active{display:block}
        #file-info-panel{position:absolute;bottom:0;left:0;right:0;background:rgba(26,26,26,.98);padding:12px 16px;border-top:4px solid #f28c38;z-index:10;display:none;font-size:13px;line-height:1.5}
        #file-info-panel.visible{display:block}
        #file-name-info{color:#f28c38;font-weight:bold;font-size:15px;margin-bottom:6px}
        #add-current-btn{position:fixed;bottom:18px;left:18px;background:#28a745;color:white;padding:14px 32px;border:none;border-radius:50px;font-size:16px;font-weight:bold;cursor:pointer;z-index:999;box-shadow:0 8px 25px rgba(40,167,69,.7);display:none}
        #add-current-btn.visible{display:block}
        #cart-panel{position:absolute;top:0;right:0;width:340px;height:100%;background:#111;border-left:3px solid #28a745;padding:16px;overflow-y:auto;z-index:90;transform:translateX(100%);transition:transform .4s ease}
        #cart-panel.active{transform:translateX(0)}
        .cart-header{background:#28a745;color:white;padding:10px;text-align:center;font-size:16px;font-weight:bold;border-radius:8px}
        .cart-item{background:#1e1e1e;padding:12px;margin:8px 0;border-radius:8px;position:relative;font-size:12.5px}
        .delete-item{position:absolute;top:6px;right:6px;background:#dc3545;color:white;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
        .qty-controls{margin-top:8px;display:flex;gap:8px;align-items:center;justify-content:center}
        .qty-controls button{width:28px;height:28px;background:#444;color:white;border:none;border-radius:50%;cursor:pointer;font-size:16px}
        .qty-controls button:hover{background:#f28c38}
        #cart-summary{background:#28a745;color:white;padding:16px;border-radius:10px;margin-top:16px;text-align:center;font-size:16px}
        .cart-final{font-size:26px!important;font-weight:bold;margin-top:10px}
        #checkout-btn{background:#0066ff;color:white;padding:16px;border:none;border-radius:50px;font-size:18px;font-weight:bold;cursor:pointer;width:100%;margin-top:14px}
        #cart-toggle{position:fixed;top:18px;right:18px;background:#28a745;color:white;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;z-index:999;cursor:pointer;box-shadow:0 10px 30px rgba(40,167,69,.7)}
        #cart-toggle:hover{transform:scale(1.1)}
        #cart-toggle .badge{position:absolute;top:-8px;right:-8px;background:#dc3545;color:white;width:28px;height:28px;border-radius:50%;font-size:13px;font-weight:bold;display:flex;align-items:center;justify-content:center}
        input[type="file"]{display:none}
    </style>
</head>
<body>
    <div id="initial-screen">
        <button id="initial-upload-btn">Subir STL</button>
        <input type="file" id="input-initial" accept=".stl,.STL">
    </div>

    <div id="main-app">
        <div id="top-panel">
            <div id="left-panel">
                <div class="header-left">COTIZADOR 3D MÉXICO</div>
                <label>Tecnología</label>
                <select id="tech-select">
                    <option value="fdm">FDM (Plástico)</option>
                    <option value="sla">SLA (Resina)</option>
                    <option value="mjf">MJF (Nylon HP)</option>
                    <option value="sls">SLS (Nylon)</option>
                    <option value="slm">SLM (Metal)</option>
                    <option value="wjp">Full Color</option>
                    <option value="bj">BJ (Metal)</option>
                </select>
                <label>Material</label>
                <div id="material-container" class="material-grid"></div>
                <label>Post-proceso</label>
                <div class="post-grid">
                    <button class="post-btn selected" data-cost="0">Ninguno</button>
                    <button class="post-btn" data-cost="15">Pulido</button>
                    <button class="post-btn" data-cost="25">Tinturado</button>
                    <button class="post-btn" data-cost="35">Arenado</button>
                </div>
                <label>Cantidad</label>
                <input type="number" id="quantity" value="1" min="1">
                <div class="price-box">
                    <div class="price-line"><span>Peso:</span> <span id="weight">0.000 kg</span></div>
                    <div class="price-line price-total"><span>COSTO PIEZAS:</span> <span id="piece-cost">$0.00</span></div>
                </div>
            </div>

            <div id="viewer-container">
                <div id="controls-bar">
                    <button id="upload-btn">Cambiar STL</button>
                    <button id="analysis-btn">Análisis</button>
                    <button id="xray-btn">Rayos X</button>
                </div>
                <input type="file" id="input-viewer" accept=".stl,.STL">
                <div id="loading-msg">Cargando...</div>
                <div id="file-info-panel">
                    <div id="file-name-info">Sin archivo</div>
                    <ul class="file-info-list">
                        <li>Ancho (X): <strong id="dim-x">0.0 mm</strong></li>
                        <li>Profundidad (Y): <strong id="dim-y">0.0 mm</strong></li>
                        <li>Altura (Z): <strong id="dim-z">0.0 mm</strong></li>
                        <li>Volumen: <strong id="volume-info">0.00 cm³</strong></li>
                    </ul>
                </div>
            </div>

            <div id="cart-panel">
                <div class="cart-header">RESUMEN DEL PEDIDO</div>
                <div id="cart-items"></div>
                <div id="cart-summary">
                    <div>Subtotal piezas: <strong id="subtotal">$0.00</strong></div>
                    <div>Peso total: <strong id="total-weight">0.000 kg</strong></div>
                    <div>Envío: <strong id="envio">$280</strong></div>
                    <div class="cart-final">TOTAL: <strong id="total-carrito">$280</strong></div>
                </div>
                <button id="checkout-btn">CHECKOUT</button>
            </div>
        </div>

        <button id="add-current-btn">Añadir al Carrito</button>
        <div id="cart-toggle">
            <i class="fas fa-shopping-cart"></i>
            <span class="badge">0</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.168.0/examples/js/controls/OrbitControls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.168.0/examples/js/loaders/STLLoader.min.js"></script>
    <script>
        // ────────────────────────────────────────────────
        // MATERIALES ACTUALIZADOS (precios ~2026 realistas por gramo impreso)
        // ────────────────────────────────────────────────
        const MATERIALS = {
            fdm: [
                {name:"PLA",          price:0.394, density:1.24},
                {name:"ABS",          price:0.498, density:1.04},
                {name:"ASA",          price:0.595, density:1.07},
                {name:"PETG",         price:0.55,  density:1.27},
                {name:"TPU",          price:0.78,  density:1.21},
                {name:"PA12-CF",      price:1.45,  density:1.10}
            ],
            sla: [
                {name:"Estándar",     price:0.196, density:1.15},
                {name:"Negra",        price:0.368, density:1.18},
                {name:"Gris",         price:0.400, density:1.18},
                {name:"Transparente", price:0.45,  density:1.16},
                {name:"Flexible",     price:0.68,  density:1.10},
                {name:"Alta Temp",    price:0.85,  density:1.17}
            ],
            mjf: [
                {name:"PA12 Negro",   price:1.25, density:1.01},
                {name:"PA12 Gris",    price:1.18, density:1.01},
                {name:"PAC-HP",       price:5.50, density:1.02}
            ],
            sls: [
                {name:"PA12",         price:0.95, density:1.00},
                {name:"PA12 Pro",     price:1.15, density:1.00},
                {name:"TPU",          price:1.40, density:1.00}
            ],
            slm: [  // ← Materiales solicitados
                {name:"Acero Inox 316L",     price:0.090, density:7.98},   // ~90 USD/kg
                {name:"AlSi10Mg (Aluminio)", price:0.100, density:2.67},   // ~100 USD/kg
                {name:"Ti-6Al-4V (Titanio)", price:0.450, density:4.43}    // ~450 USD/kg (valor medio realista)
            ],
            wjp: [{name:"Full Color",     price:4.80, density:1.20}],
            bj:  [{name:"316L BJ",        price:9.80, density:7.98}]
        };

        // Cache de elementos DOM
        const el = {
            techSelect:     document.getElementById('tech-select'),
            materialCont:   document.getElementById('material-container'),
            quantity:       document.getElementById('quantity'),
            weight:         document.getElementById('weight'),
            pieceCost:      document.getElementById('piece-cost'),
            fileNameInfo:   document.getElementById('file-name-info'),
            dimX:           document.getElementById('dim-x'),
            dimY:           document.getElementById('dim-y'),
            dimZ:           document.getElementById('dim-z'),
            volumeInfo:     document.getElementById('volume-info'),
            addBtn:         document.getElementById('add-current-btn'),
            loading:        document.getElementById('loading-msg'),
            fileInfoPanel:  document.getElementById('file-info-panel'),
            cartItems:      document.getElementById('cart-items'),
            subtotal:       document.getElementById('subtotal'),
            totalWeight:    document.getElementById('total-weight'),
            envio:          document.getElementById('envio'),
            totalCarrito:   document.getElementById('total-carrito'),
            cartBadge:      document.querySelector('#cart-toggle .badge'),
            initialScreen:  document.getElementById('initial-screen'),
            mainApp:        document.getElementById('main-app')
        };

        let scene, camera, renderer, controls, model, volume = 0, fileName = "";
        let mat = MATERIALS.fdm[0];
        let currentDims = {x:0,y:0,z:0}, currentVol = 0, currentWeight = 0;
        let cart = JSON.parse(localStorage.getItem('cart3d') || '[]');
        let boundingBoxHelper = null, isXray = false, originalMaterial = null;

        // Helpers
        const formatKg    = kg => kg.toFixed(3) + ' kg';
        const formatMoney = v  => '$' + v.toFixed(2);
        const getPostCost = () => parseFloat(document.querySelector('.post-btn.selected')?.dataset.cost || 0);
        const getTotalKg  = () => cart.reduce((sum, item) => sum + parseFloat(item.weight) * item.cantidad, 0);
        const getShipping = kg => kg > 10 ? 950 : kg > 5 ? 680 : kg > 1 ? 450 : 280;

        function init3D() {
            scene = new THREE.Scene(); scene.background = new THREE.Color(0x111111);
            camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 10000);
            renderer = new THREE.WebGLRenderer({antialias:true});
            renderer.setSize(innerWidth, innerHeight);
            renderer.setPixelRatio(devicePixelRatio);
            document.getElementById('viewer-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            scene.add(Object.assign(new THREE.DirectionalLight(0xffffff, 1.2), {position: {x:5,y:10,z:7}}));

            controls = new THREE.OrbitControls(camera, document.getElementById('viewer-container'));
            controls.enableDamping = true; controls.dampingFactor = 0.05;

            camera.position.set(0,50,200); controls.target.set(0,0,0); controls.update();

            const animate = () => {
                requestAnimationFrame(animate);
                controls.update();
                if (boundingBoxHelper) boundingBoxHelper.update();
                renderer.render(scene, camera);
            };
            animate();

            addEventListener('resize', () => {
                camera.aspect = innerWidth / innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
            });
        }
        init3D();

        // Eventos upload
        document.getElementById('initial-upload-btn').onclick = () => document.getElementById('input-initial').click();
        document.getElementById('upload-btn').onclick       = () => document.getElementById('input-viewer').click();

        ['input-initial','input-viewer'].forEach(id => {
            document.getElementById(id).onchange = e => e.target.files[0] && loadModel(e.target.files[0]);
        });

        function loadModel(file) {
            if (!/\.stl$/i.test(file.name)) return alert("Solo archivos .STL");
            fileName = file.name;
            el.loading.classList.add('active');
            el.mainApp.classList.add('active');
            el.initialScreen.style.display = 'none';

            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const geometry = new THREE.STLLoader().parse(e.target.result);
                    geometry.center();

                    const mesh = new THREE.Mesh(
                        geometry,
                        new THREE.MeshPhongMaterial({color:0xaaaaaa, shininess:100})
                    );

                    if (model) scene.remove(model);
                    scene.add(mesh); model = mesh;
                    originalMaterial = mesh.material.clone();

                    const box = new THREE.Box3().setFromObject(mesh);
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);

                    camera.position.set(maxDim*0.5, maxDim*0.5, maxDim*2);
                    controls.target.set(0,0,0); controls.update();

                    volume = (size.x * size.y * size.z) / 1000;
                    currentDims = {x:size.x.toFixed(1), y:size.y.toFixed(1), z:size.z.toFixed(1)};
                    currentVol  = volume.toFixed(2);
                    currentWeight = (volume * mat.density / 1000).toFixed(3);

                    el.fileNameInfo.textContent = fileName;
                    el.dimX.textContent         = currentDims.x + ' mm';
                    el.dimY.textContent         = currentDims.y + ' mm';
                    el.dimZ.textContent         = currentDims.z + ' mm';
                    el.volumeInfo.textContent   = currentVol + ' cm³';
                    el.fileInfoPanel.classList.add('visible');
                    el.addBtn.classList.add('visible');
                    el.loading.classList.remove('active');

                    renderMaterials();
                    calc();
                } catch(err) {
                    console.error(err);
                    el.loading.classList.remove('active');
                    alert("Error al cargar el STL");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function renderMaterials() {
            const tech = el.techSelect.value;
            const items = MATERIALS[tech] || [];

            el.materialCont.innerHTML = items.map((m,i) => `
                <button class="material-btn ${i===0?'selected':''}" 
                        data-price="${m.price}" data-density="${m.density}">
                    ${m.name}
                </button>
            `).join('');

            el.materialCont.querySelectorAll('.material-btn').forEach(btn => {
                btn.onclick = () => {
                    el.materialCont.querySelectorAll('.material-btn').forEach(b=>b.classList.remove('selected'));
                    btn.classList.add('selected');
                    mat = {
                        name: btn.textContent.trim(),
                        price: +btn.dataset.price,
                        density: +btn.dataset.density
                    };
                    calc();
                };
            });

            if (items.length) {
                mat = items[0];
                calc();
            }
        }

        function calc() {
            if (!volume) return;
            const qty = +el.quantity.value || 1;
            const post = getPostCost();
            const weightKg = (volume * mat.density) / 1000;
            const cost = (weightKg * mat.price * 1000 + post) * qty;

            el.weight.textContent    = formatKg(weightKg * qty);
            el.pieceCost.textContent = formatMoney(cost);
        }

        // Análisis y X-Ray
        document.getElementById('analysis-btn').onclick = () => {
            if (!model) return;
            if (boundingBoxHelper) {
                scene.remove(boundingBoxHelper);
                boundingBoxHelper = null;
                document.getElementById('analysis-btn').classList.remove('active');
                document.getElementById('analysis-btn').textContent = "Análisis";
            } else {
                boundingBoxHelper = new THREE.BoxHelper(model, 0xffff00);
                scene.add(boundingBoxHelper);
                boundingBoxHelper.update();
                document.getElementById('analysis-btn').classList.add('active');
                document.getElementById('analysis-btn').textContent = "Quitar Análisis";
            }
        };

        document.getElementById('xray-btn').onclick = () => {
            if (!model) return;
            const btn = document.getElementById('xray-btn');
            if (isXray) {
                model.material = originalMaterial;
                model.material.needsUpdate = true;
                btn.classList.remove('active');
                btn.textContent = "Rayos X";
                isXray = false;
            } else {
                originalMaterial = model.material.clone();
                model.material = new THREE.MeshBasicMaterial({color:0x00ffff, wireframe:true, transparent:true, opacity:0.7});
                model.material.needsUpdate = true;
                btn.classList.add('active');
                btn.textContent = "Normal";
                isXray = true;
            }
        };

        // Añadir al carrito
        el.addBtn.onclick = () => {
            if (!volume) return alert("Primero carga un STL");
            const qty = +el.quantity.value || 1;
            const postText = document.querySelector('.post-btn.selected').textContent;
            const pieceCost = parseFloat(el.pieceCost.textContent.replace(/[^0-9.]/g,''));

            cart.push({
                archivo: fileName,
                material: mat.name,
                post: postText,
                cantidad: qty,
                precio: pieceCost,
                basePrice: pieceCost / qty,
                dims: currentDims,
                vol: currentVol,
                weight: currentWeight
            });

            localStorage.setItem('cart3d', JSON.stringify(cart));
            updateCart();
            alert(`${qty} pieza(s) agregadas al carrito`);
        };

        function updateCart() {
            const totalKg  = getTotalKg();
            const subtotal = cart.reduce((s,i)=>s+i.precio,0);
            const shipping = getShipping(totalKg);

            el.cartItems.innerHTML = cart.length === 0
                ? '<p style="text-align:center;color:#888;padding:60px 0">Carrito vacío</p>'
                : cart.map((item,i)=>`
                    <div class="cart-item">
                        <div class="delete-item" onclick="removeFromCart(${i})">X</div>
                        <strong>${item.cantidad} × ${item.archivo}</strong><br>
                        ${item.material} • ${item.post}<br>
                        <small>${item.dims.x}×${item.dims.y}×${item.dims.z} mm • ${(parseFloat(item.weight)*item.cantidad).toFixed(3)} kg</small>
                        <div class="qty-controls">
                            <button onclick="changeQty(${i},-1)">-</button>
                            <strong>${item.cantidad}</strong>
                            <button onclick="changeQty(${i},1)">+</button>
                        </div>
                        <strong style="color:#28a745;float:right">${formatMoney(item.precio)}</strong>
                    </div>
                `).join('');

            el.subtotal.textContent     = formatMoney(subtotal);
            el.totalWeight.textContent  = formatKg(totalKg);
            el.envio.textContent        = formatMoney(shipping);
            el.totalCarrito.textContent = formatMoney(subtotal + shipping);
            el.cartBadge.textContent    = cart.reduce((s,x)=>s+x.cantidad,0);
        }

        window.changeQty = (i, delta) => {
            cart[i].cantidad = Math.max(1, cart[i].cantidad + delta);
            cart[i].precio   = cart[i].basePrice * cart[i].cantidad;
            localStorage.setItem('cart3d', JSON.stringify(cart));
            updateCart();
        };

        window.removeFromCart = i => {
            cart.splice(i,1);
            localStorage.setItem('cart3d', JSON.stringify(cart));
            updateCart();
        };

        document.getElementById('checkout-btn').onclick = () => {
            if (!cart.length) return alert("El carrito está vacío");
            alert("Redirigiendo al checkout... (conecta Stripe/PayPal aquí)");
        };

        document.getElementById('cart-toggle').onclick = () => document.getElementById('cart-panel').classList.toggle('active');

        el.techSelect.onchange   = renderMaterials;
        el.quantity.oninput      = calc;

        document.querySelectorAll('.post-btn').forEach(b => {
            b.onclick = () => {
                document.querySelectorAll('.post-btn').forEach(x=>x.classList.remove('selected'));
                b.classList.add('selected');
                calc();
            };
        });

        // Inicio
        renderMaterials();
        updateCart();
    </script>
</body>
</html>
