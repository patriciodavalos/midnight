<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador 3D México - FDM/SLA -10% extra</title>
    <link rel="icon" href="data:,">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#0a0a0a;color:#ddd;height:100vh;overflow:hidden;position:relative}
       
        #initial-screen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:1000}
        #initial-upload-btn{background:#f28c38;color:white;padding:20px 45px;border:none;border-radius:12px;font-size:20px;font-weight:bold;cursor:pointer;box-shadow:0 10px 30px rgba(242,140,56,.5);transition:all .3s}
        #initial-upload-btn:hover{background:#e67e22;transform:scale(1.05)}
       
        #main-app{display:none;height:100vh;flex-direction:column}
        #main-app.active{display:flex}
        #top-panel{display:flex;flex:1;position:relative}
       
        #left-panel{width:300px;background:#111;padding:14px;font-size:12.5px;overflow-y:auto;border-right:2px solid #f28c38}
        .header-left{padding:10px;background:#f28c38;color:white;text-align:center;font-weight:bold;font-size:16px;border-radius:8px 8px 0 0;margin:-14px -14px 16px -14px}
        label{margin:10px 0 4px;color:#f28c38;font-weight:bold;font-size:13px}
        select,input[type=number]{width:100%;padding:7px;border-radius:6px;border:none;background:#222;color:white;font-size:12.5px;margin-bottom:8px}
        .material-grid,.post-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
        .material-btn,.post-btn{padding:9px;background:#333;border:none;border-radius:6px;color:white;cursor:pointer;font-size:12px;transition:all .2s}
        .material-btn:hover,.post-btn:hover,.material-btn.selected,.post-btn.selected{background:#f28c38;font-weight:bold}
       
        .price-box{background:#222;padding:12px;border-radius:8px;border:2px solid #f28c38;margin-top:16px;font-size:13px}
        .price-line{display:flex;justify-content:space-between;margin:6px 0}
        .price-total{font-size:17px!important;color:#f28c38!important;font-weight:bold;border-top:1px solid #444;padding-top:8px}
       
        #viewer-container{flex:1;background:#111;position:relative;overflow:hidden;transition:width 0.4s ease}
        #viewer-container.shrinked { width: calc(100% - 340px); }
       
        #controls-bar{position:absolute;top:14px;left:14px;z-index:9999;display:flex;gap:10px}
        #controls-bar button{padding:10px 20px;background:#f28c38;color:white;border:none;border-radius:8px;font-size:13px;cursor:pointer;transition:all .3s}
        #analysis-btn{background:#007bff}
        #xray-btn{background:#ff6b35}
        #analysis-btn.active,#xray-btn.active{background:#28a745}
       
        #loading-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);padding:18px 40px;border-radius:12px;font-size:15px;border:2px solid #f28c38;color:#f28c38;display:none;z-index:1000}
        #loading-msg.active{display:block}
       
        #file-info-panel{position:absolute;bottom:0;left:0;right:0;background:rgba(26,26,26,.98);padding:12px 16px;border-top:4px solid #f28c38;z-index:10;display:none;font-size:13px;line-height:1.5}
        #file-info-panel.visible{display:block}
        #file-name-info{color:#f28c38;font-weight:bold;font-size:15px;margin-bottom:6px}
       
        #add-current-btn{position:fixed;bottom:18px;left:18px;background:#28a745;color:white;padding:14px 32px;border:none;border-radius:50px;font-size:16px;font-weight:bold;cursor:pointer;z-index:9999;box-shadow:0 8px 25px rgba(40,167,69,.7);display:none}
        #add-current-btn.visible{display:block}
       
        #cart-panel{position:absolute;top:0;right:0;width:340px;height:100%;background:#111;border-left:3px solid #28a745;padding:16px;overflow-y:auto;z-index:90;transform:translateX(100%);transition:transform .4s ease}
        #cart-panel.active{transform:translateX(0)}
        .cart-header{background:#28a745;color:white;padding:10px;text-align:center;font-size:16px;font-weight:bold;border-radius:8px}
        .cart-item{background:#1e1e1e;padding:12px;margin:8px 0;border-radius:8px;position:relative;font-size:12.5px}
        .delete-item{position:absolute;top:6px;right:6px;background:#dc3545;color:white;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
        
        .qty-controls{display:flex;align-items:center;gap:8px;margin-top:8px}
        .qty-controls button{width:28px;height:28px;background:#444;color:white;border:none;border-radius:50%;cursor:pointer;font-size:16px}
        .qty-controls button:hover{background:#f28c38}
        
        #cart-toggle{position:fixed;top:18px;right:18px;background:#28a745;color:white;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;z-index:9999;cursor:pointer;box-shadow:0 10px 30px rgba(40,167,69,.7)}
        #cart-toggle .badge{position:absolute;top:-8px;right:-8px;background:#dc3545;color:white;width:28px;height:28px;border-radius:50%;font-size:13px;font-weight:bold;display:flex;align-items:center;justify-content:center}
       
        #checkout-btn{background:#28a745;color:white;padding:16px;border:none;border-radius:50px;font-size:18px;font-weight:bold;cursor:pointer;width:100%;margin-top:20px;box-shadow:0 8px 25px rgba(40,167,69,.7);transition:all .3s}
        #checkout-btn:hover{background:#218838;transform:scale(1.03)}
       
        input[type="file"]{display:none}
    </style>
</head>
<body>

<div id="initial-screen">
    <button id="initial-upload-btn">Subir STL</button>
    <input type="file" id="input-initial" accept=".stl,.STL">
</div>

<div id="main-app">
    <div id="top-panel">
        <div id="left-panel">
            <div class="header-left">COTIZADOR 3D MÉXICO</div>
            
            <label>Tecnología</label>
            <select id="tech-select">
                <option value="fdm">FDM (Plástico)</option>
                <option value="sla">SLA (Resina)</option>
                <option value="mjf">MJF (Nylon HP)</option>
                <option value="sls">SLS (Nylon)</option>
                <option value="slm">SLM (Metal)</option>
                <option value="wjp">Full Color</option>
                <option value="bj">BJ (Metal)</option>
            </select>
            
            <label>Material</label>
            <div id="material-container" class="material-grid"></div>
            
            <label>Post-proceso</label>
            <div class="post-grid">
                <button class="post-btn selected" data-cost="0">Ninguno</button>
                <button class="post-btn" data-cost="15">Pulido</button>
                <button class="post-btn" data-cost="25">Tinturado</button>
                <button class="post-btn" data-cost="35">Arenado</button>
            </div>
            
            <label>Cantidad</label>
            <input type="number" id="quantity" value="1" min="1">
            
            <label>Moneda</label>
            <select id="currency">
                <option value="usd">USD - Dólar Americano</option>
                <option value="mxn" selected>MXN - Peso Mexicano</option>
            </select>
            
            <div class="price-box">
                <div class="price-line"><span>Peso:</span> <span id="weight">0.000 kg</span></div>
                <div class="price-line price-total"><span>COSTO PIEZAS:</span> <span id="piece-cost">$0.00</span></div>
            </div>
        </div>
        
        <div id="viewer-container">
            <div id="controls-bar">
                <button id="upload-btn">Cambiar STL</button>
                <button id="analysis-btn">Análisis</button>
                <button id="xray-btn">Rayos X</button>
            </div>
            <input type="file" id="input-viewer" accept=".stl,.STL">
            <div id="loading-msg">Cargando...</div>
            
            <div id="file-info-panel">
                <div id="file-name-info">Sin archivo</div>
                <ul class="file-info-list">
                    <li>Ancho (X): <strong id="dim-x">0.0 mm</strong></li>
                    <li>Profundidad (Y): <strong id="dim-y">0.0 mm</strong></li>
                    <li>Altura (Z): <strong id="dim-z">0.0 mm</strong></li>
                    <li>Volumen: <strong id="volume-info">0.00 cm³</strong></li>
                </ul>
            </div>
        </div>
        
        <div id="cart-panel">
            <div class="cart-header">RESUMEN DEL PEDIDO</div>
            <div id="cart-items"></div>
            <div class="cart-summary">
                <div>Costo piezas: <strong id="subtotal">$0.00</strong></div>
                <div>Envío: <strong id="envio">$280</strong></div>
                <div class="cart-final">TOTAL: <strong id="total-carrito">$280</strong></div>
            </div>
            <button id="checkout-btn">CHECKOUT</button>
        </div>
    </div>
    
    <button id="add-current-btn">Añadir al Carrito</button>
    
    <div id="cart-toggle">
        <i class="fas fa-shopping-cart"></i>
        <span class="badge">0</span>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/STLLoader.min.js"></script>

<script>
// ==================== CONFIGURACIÓN ====================
const MARGEN = 1.38;
const EXCHANGE_RATE = 20;
const GANANCIA = 1.35;

// Tecnologías locales (sin margen de aduana)
const TECHS_SIN_MARGEN = ['fdm', 'sla'];

// Precios actualizados: FDM y SLA con -10% extra respecto a la versión anterior
const MATERIALS = {
    fdm: [
        {name:"PLA",     price:0.094 * 0.5 * GANANCIA * 0.9, density:1.24},
        {name:"ABS",     price:0.130 * 0.5 * GANANCIA * 0.9, density:1.04},
        {name:"ASA",     price:0.135 * 0.5 * GANANCIA * 0.9, density:1.07},
        {name:"PETG",    price:0.055  * 0.5 * GANANCIA * 0.9, density:1.27},
        {name:"TPU",     price:0.080  * 0.5 * GANANCIA * 0.9, density:1.21},
        {name:"PA12-CF", price:0.055  * 0.5 * GANANCIA * 0.9, density:1.10}
    ],
    sla: [
        {name:"Estándar",    price:0.196 * 0.5 * GANANCIA * 0.9, density:1.15},
        {name:"Negra",       price:0.468 * 0.5 * GANANCIA * 0.9, density:1.18},
        {name:"Gris",        price:0.300 * 0.5 * GANANCIA * 0.9, density:1.18},
        {name:"Transparente",price:0.45  * 0.5 * GANANCIA * 0.9, density:1.16},
        {name:"Flexible",    price:0.68  * 0.5 * GANANCIA * 0.9, density:1.10},
        {name:"Alta Temp",   price:0.65  * 0.5 * GANANCIA * 0.9, density:1.17}
    ],
    mjf: [
        {name:"PA12 Negro", price:(0.46 * MARGEN) * 0.5 * GANANCIA, density:1.01},
        {name:"PA12 Gris",  price:(0.44 * MARGEN) * 0.5 * GANANCIA, density:1.01},
        {name:"PAC-HP",     price:(2.16 * MARGEN) * 0.5 * GANANCIA, density:1.02}
    ],
    sls: [
        {name:"PA12",     price:(0.45 * MARGEN) * 0.5 * GANANCIA, density:1.00},
        {name:"PA12 Pro", price:(0.65 * MARGEN) * 0.5 * GANANCIA, density:1.00},
        {name:"TPU",      price:(0.50 * MARGEN) * 0.5 * GANANCIA, density:1.00}
    ],
    slm: [
        {name:"Acero Inox 316L",     price:(0.173 * MARGEN) * 0.5 * GANANCIA, density:7.99},
        {name:"AlSi10Mg (Aluminio)", price:(0.110 * MARGEN) * 0.5 * GANANCIA, density:2.67},
        {name:"Ti-6Al-4V (Titanio)", price:(0.450 * MARGEN) * 0.5 * GANANCIA, density:4.43}
    ],
    wjp: [{name:"Full Color", price:(0.600 * MARGEN) * 0.5 * GANANCIA, density:1.20}],
    bj:  [{name:"316L BJ",    price:(0.172 * MARGEN) * 0.5 * GANANCIA, density:7.99}]
};

let scene, camera, renderer, controls, model, volume = 0, fileName = "", mat = MATERIALS.fdm[0];
let cart = [];
let currentDims = {x:"0.0",y:"0.0",z:"0.0"}, currentVol = "0.00", currentWeight = "0.000";
let currentCurrency = "mxn";

const $ = s => document.querySelector(s);

// ==================== VISOR 3D ====================
function init3D(){
    scene = new THREE.Scene(); scene.background = new THREE.Color(0x111111);
    camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('viewer-container').appendChild(renderer.domElement);
    
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    scene.add(new THREE.DirectionalLight(0xffffff, 1).position.set(5,10,7));
    
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    camera.position.set(0, 50, 200);
    controls.update();
    
    function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
    animate();
    
    window.addEventListener('resize', resizeViewer);
}
init3D();

function resizeViewer() {
    const isCartOpen = document.querySelector('#cart-panel')?.classList.contains('active');
    const availableWidth = isCartOpen ? window.innerWidth - 340 : window.innerWidth;
    
    camera.aspect = availableWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(availableWidth, window.innerHeight);
}

// ==================== CARGAR MODELO ====================
document.getElementById('initial-upload-btn').onclick = () => document.getElementById('input-initial').click();
document.getElementById('upload-btn').onclick = () => document.getElementById('input-viewer').click();

function loadModel(file) {
    if (!file || !/\.stl$/i.test(file.name)) return alert("Solo archivos .STL");

    fileName = file.name;
    document.getElementById('loading-msg').classList.add('active');
    document.getElementById('main-app').classList.add('active');
    document.getElementById('initial-screen').style.display = 'none';

    const reader = new FileReader();
    reader.onload = e => {
        try {
            const loader = new THREE.STLLoader();
            const geometry = loader.parse(e.target.result);
            const mesh = new THREE.Mesh(geometry, new THREE.MeshPhongMaterial({color: 0xeeeeee, shininess: 80}));

            if (model) scene.remove(model);
            scene.add(mesh);
            model = mesh;

            const box = new THREE.Box3().setFromObject(mesh);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);

            mesh.scale.setScalar(80 / maxDim);
            mesh.position.set(0,0,0);

            volume = (size.x * size.y * size.z) / 1000;
            currentDims = {x: size.x.toFixed(1), y: size.y.toFixed(1), z: size.z.toFixed(1)};
            currentVol = volume.toFixed(2);
            currentWeight = (volume * mat.density / 1000).toFixed(3);

            document.getElementById('file-name-info').textContent = fileName;
            document.getElementById('dim-x').textContent = currentDims.x + ' mm';
            document.getElementById('dim-y').textContent = currentDims.y + ' mm';
            document.getElementById('dim-z').textContent = currentDims.z + ' mm';
            document.getElementById('volume-info').textContent = currentVol + ' cm³';
            document.getElementById('file-info-panel').classList.add('visible');
            document.getElementById('add-current-btn').classList.add('visible');

            document.getElementById('loading-msg').classList.remove('active');
            renderMaterials();
            calc();
            resizeViewer();
        } catch(err) {
            console.error(err);
            document.getElementById('loading-msg').classList.remove('active');
            alert("Error al procesar el archivo STL");
        }
    };
    reader.readAsArrayBuffer(file);
}

document.getElementById('input-initial').onchange = e => e.target.files[0] && loadModel(e.target.files[0]);
document.getElementById('input-viewer').onchange = e => e.target.files[0] && loadModel(e.target.files[0]);

// ==================== MATERIALES ====================
function renderMaterials(){
    const tech = document.getElementById('tech-select').value;
    const cont = document.getElementById('material-container');
    cont.innerHTML = '';

    (MATERIALS[tech] || []).forEach((m, i) => {
        const b = document.createElement('button');
        b.className = 'material-btn';
        if (i === 0) b.classList.add('selected');
        b.textContent = m.name;
        b.onclick = () => {
            cont.querySelectorAll('.material-btn').forEach(x => x.classList.remove('selected'));
            b.classList.add('selected');
            mat = m;
            calc();
        };
        cont.appendChild(b);
    });
    if (MATERIALS[tech] && MATERIALS[tech].length > 0) {
        mat = MATERIALS[tech][0];
        calc();
    }
}

document.getElementById('tech-select').onchange = renderMaterials;

// ==================== CÁLCULO ====================
function calc(){
    if (volume <= 0) {
        document.getElementById('weight').textContent = "0.000 kg";
        document.getElementById('piece-cost').textContent = "$0.00";
        return;
    }

    const qty = parseInt(document.getElementById('quantity').value) || 1;
    const post = parseFloat(document.querySelector('.post-btn.selected')?.dataset.cost || 0);
    const weightKg = (volume * mat.density) / 1000;

    const tech = document.getElementById('tech-select').value;
    const aplicarMargen = !TECHS_SIN_MARGEN.includes(tech);
    const precioUnitario = mat.price * (aplicarMargen ? MARGEN : 1);

    let costUSD = (weightKg * precioUnitario * 1000 + post) * qty;

    const currency = document.getElementById('currency').value;
    let finalCost = costUSD;
    let symbol = '$';

    if (currency === 'mxn') {
        finalCost = costUSD * EXCHANGE_RATE;
        symbol = 'MX$';
    }

    document.getElementById('weight').textContent = (weightKg * qty).toFixed(3) + ' kg';
    document.getElementById('piece-cost').textContent = symbol + finalCost.toFixed(2);
}

document.getElementById('quantity').oninput = calc;
document.getElementById('currency').onchange = () => {
    calc();
    updateCart();
};

// ==================== AÑADIR AL CARRITO ====================
document.getElementById('add-current-btn').onclick = () => {
    if (!fileName || volume <= 0) return alert("Primero carga un archivo STL válido");

    const qty = parseInt(document.getElementById('quantity').value) || 1;
    const selectedBtn = document.querySelector('#material-container .material-btn.selected');
    if (!selectedBtn) return alert("Selecciona un material");

    const techSelect = document.getElementById('tech-select');
    const techName = techSelect.options[techSelect.selectedIndex].text.trim();

    const materialName = selectedBtn.textContent.trim();
    const postBtn = document.querySelector('.post-btn.selected');
    const postName = postBtn ? postBtn.textContent.trim() : "Ninguno";

    let pieceCostText = document.getElementById('piece-cost').textContent || "0";
    pieceCostText = pieceCostText.replace(/[^0-9.]/g, '');
    const pieceCostUSD = parseFloat(pieceCostText) || 0;

    if (pieceCostUSD <= 0) {
        alert("No se pudo obtener un precio válido");
        return;
    }

    cart.push({
        tecnologia: techName,
        archivo: fileName,
        material: materialName,
        post: postName,
        cantidad: qty,
        precioUSD: pieceCostUSD,
        dims: currentDims,
        vol: currentVol,
        weight: currentWeight
    });

    updateCart();
    alert(`¡Añadidas ${qty} pieza(s) al carrito!`);
};

// ==================== ACTUALIZAR CARRITO ====================
function updateCart() {
    const items = document.getElementById('cart-items');
    const badge = document.querySelector('#cart-toggle .badge');
    const currency = document.getElementById('currency').value;
    const rate = currency === 'mxn' ? EXCHANGE_RATE : 1;
    const symbol = currency === 'mxn' ? 'MX$' : '$';

    if (cart.length === 0) {
        items.innerHTML = "<p style='text-align:center;color:#888;padding:40px 0;font-size:13px'>Carrito vacío</p>";
        document.getElementById('subtotal').textContent = symbol + "0.00";
        document.getElementById('envio').textContent = symbol + "280.00";
        document.getElementById('total-carrito').textContent = symbol + "280.00";
        badge.textContent = "0";
        return;
    }

    let subtotal = 0;
    items.innerHTML = cart.map((item, i) => {
        const price = item.precioUSD * rate;
        const itemTotal = price * item.cantidad;
        subtotal += itemTotal;

        return `
            <div class="cart-item">
                <div class="delete-item" onclick="removeFromCart(${i})">X</div>
                <strong>${item.cantidad} × ${item.archivo}</strong><br>
                <small>Tecnología: ${item.tecnologia}</small><br>
                ${item.material} • ${item.post}<br>
                <div style="font-size:11px;color:#aaa">
                    ${item.dims.x}×${item.dims.y}×${item.dims.z} mm • ${item.vol} cm³ • ${item.weight} kg
                </div>
                
                <div class="qty-controls">
                    <button onclick="changeQty(${i}, -1)">-</button>
                    <span>${item.cantidad}</span>
                    <button onclick="changeQty(${i}, 1)">+</button>
                </div>
                
                <strong style="color:#28a745;float:right">${symbol}${itemTotal.toFixed(2)}</strong>
            </div>
        `;
    }).join('');

    document.getElementById('subtotal').textContent = symbol + subtotal.toFixed(2);
    document.getElementById('total-carrito').textContent = symbol + (subtotal + 280 * rate).toFixed(2);
    badge.textContent = cart.reduce((s, item) => s + item.cantidad, 0);
}

window.changeQty = function(index, delta) {
    cart[index].cantidad = Math.max(1, cart[index].cantidad + delta);
    updateCart();
};

window.removeFromCart = function(index) {
    cart.splice(index, 1);
    updateCart();
};

// ==================== TOGGLE CARRITO ====================
document.getElementById('cart-toggle').onclick = () => {
    const panel = document.getElementById('cart-panel');
    panel.classList.toggle('active');
    
    if (panel.classList.contains('active')) {
        document.getElementById('viewer-container').classList.add('shrinked');
    } else {
        document.getElementById('viewer-container').classList.remove('shrinked');
    }
    resizeViewer();
};

// ==================== INICIO ====================
renderMaterials();
updateCart();
resizeViewer();
</script>
</body>
</html>
